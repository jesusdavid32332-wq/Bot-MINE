    <script>
      // Ignore HMR WebSocket connection errors in iFrame sandbox per environment instructions
      (function() {
        function isViteHmrError(err) {
          if (!err) return false;
          var msg = String(err.message || err || '');
          var stack = String(err.stack || '');
          var file = String(err.filename || '');
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('ws') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('WebSocket') !== -1 ||
            file.indexOf('@vite/client') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (
            isViteHmrError(event.error) ||
            isViteHmrError(event.message) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
