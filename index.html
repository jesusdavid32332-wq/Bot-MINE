<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore HMR WebSocket connection errors in iFrame sandbox per environment instructions
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
            event.reason.message?.includes('ws') ||
            String(event.reason?.stack).includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message?.includes('WebSocket') ||
          String(event.filename).includes('@vite/client')
        ) {
          event.preventDefault();
        }
      });
    </script>
    <title>Juan Carlos | Mines AI 💎 — Panel de Administración</title>
